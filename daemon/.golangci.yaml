---
version: '2'
linters:
  enable:
    - asciicheck
    - errorlint
    - gosec
    - prealloc
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
  disable: [errcheck]
  settings:
    gosec:
      excludes: [G115]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths: [third_party$, builtin$, examples$]
formatters:
  exclusions:
    generated: lax
    paths: [third_party$, builtin$, examples$]
