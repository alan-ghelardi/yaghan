syntax = "proto3";

package yaghan.control_plane.v1alpha1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

message Sandbox {
  SandboxMeta metadata = 1 [(buf.validate.field).required = true];

  EgressPolicy egress_policy = 2;

  // Sandbox.resources is required on the wire only for image-sourced
  // sandboxes; snapshot-sourced sandboxes inherit their resources from
  // the snapshot record and MUST leave this field unset on
  // CreateSandbox. The api-server validates the conditional rule and
  // stamps the inherited values before persistence — so every persisted
  // row carries a populated Resources regardless of how it was created.
  Resources resources = 3;

  NodeRef node = 4;

  Intent intent = 5;

  SnapshotOutput last_snapshot = 6;

  SandboxStatus status = 7;
}

message SandboxMeta {
  string id = 1 [(buf.validate.field).required = true];

  string namespace = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,61}[a-z0-9]$"
  ];

  SandboxSource source = 3;

  int64 version = 4;

  google.protobuf.Timestamp created_at = 5;

  google.protobuf.Timestamp last_modified_at = 6;

  // Arbitrary key/value labels for client-side grouping and
  // filtering (e.g. "project=foo", "ci-run=123"). Keys are required
  // to be 1-63 chars, lowercase alphanumeric with dots/dashes/
  // underscores, starting and ending with an alphanumeric. Values
  // may be empty or follow the same rules (uppercase permitted).
  map<string, string> labels = 7 [(buf.validate.field).map = {
    keys: {
      string: {pattern: "^[a-z0-9]([-a-z0-9._]{0,61}[a-z0-9])?$"}
    }
    values: {
      string: {pattern: "^([a-zA-Z0-9]([-a-zA-Z0-9._]{0,61}[a-zA-Z0-9])?)?$"}
    }
  }];
}

message SandboxSource {
  oneof reference {
    string snapshot_id = 1;
    string image_id = 2;
  }
}

message EgressPolicy {
  oneof rules {
    EgressTargets allow = 1;
    EgressTargets deny = 2;
  }
}

message EgressTargets {
  repeated string ip_addresses = 1 [(buf.validate.field).cel = {
    id: "ip_addresses.valid_ip"
    message: "all ip_addresses entries must be valid IP addresses"
    expression: "this.all(ip, ip.isIp())"
  }];

  repeated string cidr_blocks = 2 [(buf.validate.field).cel = {
    id: "cidr_blocks.valid_cidr"
    message: "all cidr_blocks entries must be valid CIDR blocks"
    expression: "this.all(cidr, cidr.isIpPrefix())"
  }];

  repeated string domain_names = 3 [(buf.validate.field).repeated = {
    items: {
      cel: [
        {
          id: "domain_name.syntax"
          message: "must be a hostname like example.net or a wildcard like *.example.net"
          expression: "this.matches('^((\\\\*\\\\.)?[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\\\.)+[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')"
        }
      ]
    }
  }];
}

message Resources {
  uint32 vcpu_count = 1 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 32
  ];

  // Memory in MiB. Lower bound matches the smallest useful
  // Firecracker VM; upper bound leaves room for 128 GiB sandboxes.
  uint64 memory_mib = 2 [
    (buf.validate.field).uint64.gte = 128,
    (buf.validate.field).uint64.lte = 131072
  ];

  // Root disk size in MiB. Optional: 0 means "use the daemon's
  // configured default". When set, the daemon resizes the per-VM
  // copy of the base rootfs image up to this size at provision time
  // (ext4 grow on a sparse file — metadata-only, no eager allocation).
  // Lower bound is the base image size; the upper bound is generous
  // (1 TiB) on the spec side, with hosts further constrained by
  // their advertised disk_capacity_bytes.
  uint64 disk_mib = 3 [(buf.validate.field).cel = {
    id: "resources.disk_mib.range"
    message: "disk_mib must be 0 (use daemon default) or between 256 and 1048576 MiB"
    expression: "this == 0u || (this >= 256u && this <= 1048576u)"
  }];
}

message NodeRef {
  string id = 1 [(buf.validate.field).required = true];
}

message Intent {
  SandboxStatus.Phase phase = 1;
  StartSnapshotInput start_snapshot = 2;
}

message StartSnapshotInput {
  string description = 1 [(buf.validate.field).string.max_len = 256];
}

message SnapshotOutput {
  string snapshot_id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.rpc.Status error = 3;
}

message SandboxStatus {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_PENDING = 1;
    PHASE_RUNNING = 2;
    PHASE_PAUSING = 3;
    PHASE_PAUSED = 4;
    PHASE_RESUMING = 5;
    PHASE_SNAPSHOTTING = 6;
    PHASE_DELETING = 7;
    PHASE_DELETED = 8;
    PHASE_FAILED = 9;
  }

  Phase phase = 1;

  string message = 2;
}

message CreateSandboxRequest {
  Sandbox sandbox = 1 [(buf.validate.field).required = true];
}

message CreateSandboxResponse {
  Sandbox sandbox = 1 [(buf.validate.field).required = true];
}

message GetSandboxRequest {
  string sandbox_id = 1 [(buf.validate.field).required = true];
}

message GetSandboxResponse {
  Sandbox sandbox = 1;
}

// Request message for listing sandboxes with optional filtering and pagination.
message ListSandboxesRequest {
  // Filters sandboxes by namespace.
  // When provided, must match the format:
  // - starts with a lowercase letter
  // - contains only lowercase alphanumeric characters or hyphens
  // - ends with an alphanumeric character
  // Example: "default", "team-a"
  // May be empty when node_id is supplied (e.g. the data-plane daemon's
  // per-node resync scan).
  string namespace = 1;

  // Filters sandboxes by the ID of the node where they are scheduled or running.
  string node_id = 2;

  // Filters sandboxes by their current lifecycle phase.
  // If unset, sandboxes in all phases are returned.
  SandboxStatus.Phase status_phase = 3;

  // Token used for pagination.
  // Pass the value returned in a previous response to retrieve the next page of results.
  // Leave empty to start listing from the beginning.
  string continuation_token = 4;

  // Maximum number of sandboxes to return in this request.
  // Defaults to 30 if not specified.
  // The maximum allowed value is 1000.
  int32 page_size = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1000
  ];

  // Controls how results are ordered by last modification time.
  enum Order {
    ORDER_UNSPECIFIED = 0;

    // Most recently modified sandboxes first.
    ORDER_NEWEST_FIRST = 1;

    // Least recently modified sandboxes first.
    ORDER_OLDEST_FIRST = 2;
  }

  // Sort order applied to the results based on last_modified_at.
  Order sort_order = 6;

  // Validation rule: at least one of `namespace` or `node_id` must be provided.
  // This prevents unbounded global queries.
  option (buf.validate.message).cel = {
    id: "ListSandboxesRequest.required_fields"
    expression: "has(this.namespace) || has(this.node_id)"
    message: "At least one of `namespace` or `node_id` must be provided to list sandboxes."
  };

  // Validation rule: when namespace is provided, it must match the
  // canonical pattern. Encoded at the message level (not as a
  // field-level string.pattern) so an empty namespace — valid when
  // node_id alone narrows the query — doesn't trip the regex on the
  // zero value.
  option (buf.validate.message).cel = {
    id: "ListSandboxesRequest.namespace_pattern"
    expression: "this.namespace == '' || this.namespace.matches('^[a-z][a-z0-9-]{0,61}[a-z0-9]$')"
    message: "namespace must match ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ when provided."
  };
}

// Response message containing a page of sandboxes.
message ListSandboxesResponse {
  // The list of sandboxes matching the request filters.
  repeated Sandbox sandboxes = 1;

  // Token to retrieve the next page of results.
  // Empty if there are no more results.
  string continuation_token = 2;
}

message PauseSandboxRequest {
  string sandbox_id = 1 [(buf.validate.field).required = true];
  int64 version = 2 [(buf.validate.field).required = true];
}

message PauseSandboxResponse {
  Sandbox sandbox = 1;
}

message ResumeSandboxRequest {
  string sandbox_id = 1 [(buf.validate.field).required = true];
  int64 version = 2 [(buf.validate.field).required = true];
}

message ResumeSandboxResponse {
  Sandbox sandbox = 1;
}

message DeleteSandboxRequest {
  string sandbox_id = 1 [(buf.validate.field).required = true];
  int64 version = 2 [(buf.validate.field).required = true];
}

message DeleteSandboxResponse {
  Sandbox sandbox = 1;
}

message StartSnapshotRequest {
  string sandbox_id = 1 [(buf.validate.field).required = true];

  int64 version = 2 [(buf.validate.field).required = true];

  string description = 3 [(buf.validate.field).string.max_len = 256];
}

message StartSnapshotResponse {
  Sandbox sandbox = 1;
}

service SandboxService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse) {
    option (google.api.http) = {
      post: "/v1alpha1/sandboxes"
      body: "*"
    };
  }

  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse) {
    option (google.api.http) = {get: "/v1alpha1/sandboxes/{sandbox_id}"};
  }

  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse) {
    option (google.api.http) = {get: "/v1alpha1/sandboxes"};
  }

  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse) {
    option (google.api.http) = {put: "/v1alpha1/sandboxes/{sandbox_id}/pause"};
  }

  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse) {
    option (google.api.http) = {put: "/v1alpha1/sandboxes/{sandbox_id}/resume"};
  }

  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse) {
    option (google.api.http) = {delete: "/v1alpha1/sandboxes/{sandbox_id}"};
  }

  rpc StartSnapshot(StartSnapshotRequest) returns (StartSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1alpha1/sandboxes/{sandbox_id}/snapshots"
      body: "*"
    };
  }
}
